<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Yume Space ✦</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f3f6;
            color: #4a3e4d;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #e8d5e5, #d2e1f8);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2em;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .notice {
            background-color: #fff0f5;
            border-left: 4px solid #db7093;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>

    </header>

    <div class="container">
        <div class="card">
            <h2>💕 About Us</h2>
            <p><strong>Original Character (OC):</strong> Your OC Name</p>
            <p><strong>Canon Character:</strong> Canon Name</p>
        </div>

        <div class="notice">
